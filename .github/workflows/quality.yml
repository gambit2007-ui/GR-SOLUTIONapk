name: Quality

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: npm run test
        env:
          TZ: America/Sao_Paulo
      - name: Financial report regressions in UTC
        run: npm test -- --run src/utils/__tests__/financialDates.test.ts src/utils/__tests__/realizedIncome.test.ts src/utils/__tests__/monthlyCashReportPdf.test.ts src/utils/__tests__/monthlyCashReportPdf.export.test.ts
        env:
          TZ: UTC
      - run: npm run test:rules
      - run: npm run build
      - run: git diff --check
